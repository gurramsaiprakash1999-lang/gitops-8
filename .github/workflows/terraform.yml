name: "Beginner Terraform Workflow"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: write

jobs:
  terraform:
    name: "Execute Terraform"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull the latest code and saved state from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS login using Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      # Step 3: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Step 4: Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Step 5: Run Apply (when you choose 'apply')
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      # Step 6: Run Destroy (when you choose 'destroy')
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false

      # Step 7: Save the state file back to GitHub repository
      - name: Save Terraform State to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add terraform.tfstate* || true
          git commit -m "chore: update terraform state [skip ci]" || echo "No state changes to commit"
          git push
